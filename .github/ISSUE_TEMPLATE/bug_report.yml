name: Bug report
description: Report a reproducible problem in JET
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove personal data, credentials and purchase receipts before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 2.0.0 / 206 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence of actions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
