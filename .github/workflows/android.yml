name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install content tooling
        run: python -m pip install -r tools/requirements-content.txt
      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build preview APK
        run: ./gradlew :app:assemblePreview --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: jet-preview-apk
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/test-results/**
            app/build/reports/**
          if-no-files-found: ignore
